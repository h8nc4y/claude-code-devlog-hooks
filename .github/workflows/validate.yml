name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate hooks repository
    # plugin/hook testsに加えてscannerのPS7/PS5.1 full self-testを直列実行するため、
    # hosted Windowsの実測余裕を含む有限budgetを明示する。
    timeout-minutes: 25
    # windows-latest is intentional and left unpinned: this job only needs
    # pwsh + Windows PowerShell + git, so runner image migrations do not
    # affect it. Pin to a dated label only if a future step depends on
    # image-specific tooling.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate OSS readiness
        shell: pwsh
        run: ./scripts/validate-oss-readiness.ps1

      - name: Test plugin package (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-plugin.ps1

      - name: Test plugin package (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-plugin.ps1

      - name: Test plugin launcher (Git Bash)
        shell: bash
        run: ./scripts/test-plugin-launcher.sh

      - name: Test hooks (pipe tests, PowerShell 7)
        shell: pwsh
        run: ./scripts/test-hooks.ps1 -HookShell pwsh

      - name: Test hooks (pipe tests, Windows PowerShell 5.1)
        shell: pwsh
        run: ./scripts/test-hooks.ps1 -HookShell powershell

      - name: Test private marker scan (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-scan-private-markers.ps1

      - name: Test private marker scan (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-scan-private-markers.ps1

      - name: Scan for private markers
        shell: pwsh
        run: ./scripts/scan-private-markers.ps1

      - name: Check whitespace
        shell: pwsh
        # A fresh checkout has no worktree/index diff, so `git diff --check`
        # would be vacuous here. Diff the committed tree against the empty
        # tree (the SHA-1 empty-tree constant) so whitespace errors in
        # committed content actually fail the job (exit 2 on findings).
        run: git diff-tree --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  bash-hooks:
    name: Test Bash hooks on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate OSS readiness on Ubuntu
        shell: pwsh
        run: ./scripts/validate-oss-readiness.ps1

      - name: Check Bash syntax
        shell: bash
        run: for script in hooks/*.sh scripts/*.sh; do bash --noprofile --norc -n "$script" || exit 1; done

      - name: Test plugin package
        shell: pwsh
        run: ./scripts/test-plugin.ps1

      - name: Test plugin launcher
        shell: bash
        run: ./scripts/test-plugin-launcher.sh

      - name: Test hooks (shared pipe tests plus POSIX path cases)
        shell: pwsh
        run: ./scripts/test-hooks.ps1 -HookShell bash

      - name: Test private marker scan (PowerShell 7 on Ubuntu)
        shell: pwsh
        run: ./scripts/test-scan-private-markers.ps1

      - name: Scan for private markers on Ubuntu
        shell: pwsh
        run: ./scripts/scan-private-markers.ps1

      - name: Check whitespace
        shell: pwsh
        run: git diff-tree --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  macos-bash-3-2:
    name: Test Bash hooks on macOS 15 / Bash 3.2
    # macOS 15のsystem Bashを互換性floorとして実測し、latest labelの移行で
    # 検証対象OSが無言で変わらないようdated standard runnerを選ぶ。
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify Darwin and system Bash 3.2
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: test "$(uname -s)" = Darwin && test "$BASH" = /bin/bash && [[ "$BASH_VERSION" == 3.2.* ]]

      - name: Validate OSS readiness on macOS
        shell: pwsh
        run: ./scripts/validate-oss-readiness.ps1

      - name: Test plugin package on macOS
        shell: pwsh
        run: ./scripts/test-plugin.ps1

      - name: Check Bash syntax with system Bash 3.2
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: for script in hooks/*.sh scripts/*.sh; do /bin/bash --noprofile --norc -n "$script" || exit 1; done

      - name: Test plugin launcher with system Bash 3.2
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: /bin/bash --noprofile --norc ./scripts/test-plugin-launcher.sh

      - name: Test hooks with system Bash 3.2
        shell: pwsh
        run: ./scripts/test-hooks.ps1 -HookShell /bin/bash
